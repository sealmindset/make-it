# =============================================================================
# pyproject.toml -- Python Tool Configuration
# =============================================================================
# Generated by /make-it scaffold (fastapi-nextjs)
#
# All Python quality tool configuration lives here:
#   - Ruff (lint + format + security)
#   - mypy (type checking)
#   - pytest + coverage
#
# DevOps can override any setting. These are sensible defaults.
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "S",   # flake8-bandit (security)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
# Report unused imports/variables, never delete them automatically: an import can be there for
# what it does when loaded (registering models, routes, signals), and `ruff --fix` -- which the
# pre-commit hook runs -- cannot tell. Remove them by hand, or with /deadcode-it.
unfixable = ["F401", "F841"]

# FastAPI's dependency markers are meant to be called in a default argument: that is how FastAPI
# declares them, so B008 doesn't apply to them (ruff's lint.flake8-bugbear.extend-immutable-calls).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
    "fastapi.Cookie", "fastapi.File", "fastapi.Form", "fastapi.Security",
    # the scaffold's own permission check: it builds the dependency once, when the route is declared
    "app.middleware.permissions.require_permission",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]   # allow assert in tests
"backend/alembic/*" = ["E501"] # migrations can have long lines
# Alembic writes migrations in its own shape (Union/Optional annotations, its import order); they
# are kept as generated
"backend/alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]
# mock-oidc is copied into every app as-is and never regenerated: it is not linted
"mock-services/mock-oidc/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
# the same two, kept as they are: migrations as Alembic wrote them, mock-oidc as copied
exclude = ["backend/alembic/versions/*", "mock-services/mock-oidc/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--cov=backend/app --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
