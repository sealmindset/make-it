name: "[APP_SLUG] Quality Gate"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Ruff lint
        id: ruff_lint
        run: ruff check .
        continue-on-error: true

      - name: Ruff format check
        id: ruff_format
        run: ruff format --check .
        continue-on-error: true

      - name: mypy type check
        id: mypy
        run: mypy app/
        continue-on-error: true

      - name: pytest with coverage
        id: pytest
        run: pytest --cov --cov-report=json --cov-report=term -q
        continue-on-error: true

      - name: Write results
        if: always()
        env:
          RUFF_LINT: ${{ steps.ruff_lint.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          cat <<EOF > /tmp/python-results.json
          {
            "ruff_lint": "$RUFF_LINT",
            "ruff_format": "$RUFF_FORMAT",
            "mypy": "$MYPY",
            "pytest": "$PYTEST"
          }
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: /tmp/python-results.json

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        id: eslint
        run: npx eslint .
        continue-on-error: true

      - name: Prettier check
        id: prettier
        run: npx prettier --check .
        continue-on-error: true

      - name: TypeScript type check
        id: tsc
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Write results
        if: always()
        env:
          ESLINT: ${{ steps.eslint.outcome }}
          PRETTIER: ${{ steps.prettier.outcome }}
          TSC: ${{ steps.tsc.outcome }}
        run: |
          cat <<EOF > /tmp/frontend-results.json
          {
            "eslint": "$ESLINT",
            "prettier": "$PRETTIER",
            "tsc": "$TSC"
          }
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: /tmp/frontend-results.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: gitleaks
        id: gitleaks
        run: |
          GITLEAKS_VERSION=v8.29.1   # the same version as the gitleaks hook's rev in .pre-commit-config.yaml
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar xz
          ./gitleaks detect --config .gitleaks.toml --source . --no-banner
        continue-on-error: true

      - name: pip-audit
        id: pip_audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true

      - name: npm audit
        id: npm_audit
        run: cd frontend && npm audit --audit-level=high
        continue-on-error: true

      - name: Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
        continue-on-error: true

      - name: Write results
        if: always()
        env:
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          PIP_AUDIT: ${{ steps.pip_audit.outcome }}
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
        run: |
          cat <<EOF > /tmp/security-results.json
          {
            "gitleaks": "$GITLEAKS",
            "pip_audit": "$PIP_AUDIT",
            "npm_audit": "$NPM_AUDIT",
            "trivy": "$TRIVY"
          }
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: /tmp/security-results.json

  watermark:
    name: make-it watermark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The pull request's own commit, not GitHub's trial merge with the base branch: the seal covers
      # exactly what was sealed, and a trial merge is different content.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read make-it version
        id: version
        run: |
          if [ ! -f .make-it/manifest.json ]; then
            echo "::error::.make-it/manifest.json is missing, so the make-it version of this project is unknown. Run /resume-it, then push again."
            exit 1
          fi
          VERSION=$(jq -r '.framework.version // empty' .make-it/manifest.json 2>/dev/null || true)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.make-it/manifest.json has no usable make-it version (framework.version must look like 1.2.3). Run /resume-it, then push again."
            exit 1
          fi
          # Releases before 1.60.0 have no seal check: a project must not be able to pick one.
          if [ "$(printf '%s\n' "1.60.0" "$VERSION" | sort -V | head -n1)" != "1.60.0" ]; then
            echo "::error::This project names make-it $VERSION, which is older than 1.60.0 and cannot check the seal. Update make-it, run /resume-it, then push again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: sealmindset/make-it
          ref: v${{ steps.version.outputs.version }}
          path: .make-it-framework
          persist-credentials: false

      - name: Verify watermark
        run: |
          # The seal counts every new file in the project, so make-it must not sit inside it.
          mv .make-it-framework "$RUNNER_TEMP/make-it"
          set +e
          python3 -I "$RUNNER_TEMP/make-it/.claude/make-it/scripts/watermark.py" verify --app . --framework "$RUNNER_TEMP/make-it/.claude/make-it" > "$RUNNER_TEMP/watermark.txt" 2>&1
          CODE=$?
          set -e

          cat "$RUNNER_TEMP/watermark.txt"
          {
            echo "## make-it watermark"
            echo '```text'
            cat "$RUNNER_TEMP/watermark.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" -eq 0 ]; then
            exit 0
          elif [ "$CODE" -eq 3 ]; then
            echo "::warning::Security files differ from the make-it release; see the job log"
            exit 0
          fi
          echo "::error::This project's code does not match its make-it seal. Run /resume-it, then push again."
          exit 1

  attestation:
    name: Quality Attestation
    needs: [python-quality, frontend-quality, security-scan, watermark]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/results

      - name: Generate attestation
        env:
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          PYTHON=$(cat /tmp/results/python-results/python-results.json)
          FRONTEND=$(cat /tmp/results/frontend-results/frontend-results.json)
          SECURITY=$(cat /tmp/results/security-results/security-results.json)

          ALL_PASS="pass"
          for outcome in $(echo "$PYTHON $FRONTEND $SECURITY" | jq -r 'to_entries[].value'); do
            if [ "$outcome" != "success" ]; then
              ALL_PASS="fail"
              break
            fi
          done

          jq -n \
            --arg app "[APP_SLUG]" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$COMMIT" \
            --arg branch "$BRANCH" \
            --arg overall "$ALL_PASS" \
            --argjson python "$PYTHON" \
            --argjson frontend "$FRONTEND" \
            --argjson security "$SECURITY" \
            '{
              app: $app,
              timestamp: $ts,
              commit: $commit,
              branch: $branch,
              checks: {
                ruff_lint: $python.ruff_lint,
                ruff_format: $python.ruff_format,
                mypy: $python.mypy,
                pytest: $python.pytest,
                eslint: $frontend.eslint,
                prettier: $frontend.prettier,
                tsc: $frontend.tsc,
                gitleaks: $security.gitleaks,
                pip_audit: $security.pip_audit,
                npm_audit: $security.npm_audit,
                trivy: $security.trivy
              },
              overall: $overall,
              generated_by: "quality-gate.yml v1.0"
            }' > quality-gate-report.json

          echo "## Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat quality-gate-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: quality-gate-report.json
          retention-days: 90
