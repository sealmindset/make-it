name: hostile-code contract

# X09 stops a run and tells the user their project may be attacking their computer. The test pins
# what it must catch, what it must leave alone, and that each skill runs it before any code runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: hostile-code contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/test-hostile-code.py
