name: contract tests

# Every scripts/test-*.sh pins rules the skills and references must keep: how they ask, what they
# refuse, what a checker rejects. Until this workflow, only three of them ran in CI, so an edit
# could drop a rule and nothing would say so. This runs all of them, each on its own, and lists
# every one that fails (it does not stop at the first).
# A new scripts/test-*.sh is picked up without touching this file.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: contract tests (every scripts/test-*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The runner pool mixes AMD and Intel machines; gitleaks before v8.24.0 crashed only on Intel ones with FSRM.
      # Naming the processor lets a failure that follows the machine be told from one that follows the code.
      - name: The processor this run landed on
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo | grep -ow -e erms -e fsrm | tr '\n' ' '; echo
      - name: A git identity for the tests that make throwaway repositories
        run: |
          git config --global user.name "contract tests"
          git config --global user.email "contract-tests@example.invalid"
          git config --global init.defaultBranch main
      # test-claude-agent-text-only.sh also runs the fastapi-nextjs scaffold's own provider tests. They import the
      # scaffold's packages, and the one test that reads the real SDK's command line needs claude-agent-sdk.
      # No sign-in token is present and no model call is made: the tests use a scripted stream.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the scaffold backend's packages and the pinned Agent SDK
        run: |
          python -m pip install --quiet -r .claude/make-it/scaffolds/fastapi-nextjs/backend/requirements.txt
          python -m pip install --quiet "claude-agent-sdk==0.2.186"
      # test-git-guards.sh makes real commits through the scaffold's pre-commit hooks (it fetches them from
      # GitHub); test-no-force-push.sh runs install.ps1's settings helper under pwsh, which the runner has.
      # Both fail here, in CI, when their tool is missing, instead of skipping. pre-commit is pinned here, and
      # only here: bump this line (and nothing else) to move CI to a newer pre-commit.
      - name: Install pre-commit
        run: python -m pip install --quiet "pre-commit==4.4.0"
      # test-argo-it-workflow-fits-the-scaffold.sh reads docker-compose.yml and the workflow it fills with PyYAML.
      - name: Install PyYAML
        run: python -m pip install --quiet "pyyaml==6.0.2"
      # test-argo-it-signin-on-the-cluster.sh runs the scaffold's own mock-oidc under its own pinned packages
      # (its requirements.txt, server version included), in a venv of its own so the backend's stay as they are.
      - name: A venv for mock-oidc, from its own pinned requirements
        run: |
          python -m venv "$RUNNER_TEMP/mock-oidc-venv"
          "$RUNNER_TEMP/mock-oidc-venv/bin/pip" install --quiet -r .claude/make-it/scaffolds/fastapi-nextjs/mock-services/mock-oidc/requirements.txt
      # Each scaffold's mock-oidc carries its own checks (access code, cookie, admin API from its own pod only).
      - name: mock-oidc's own checks, in each scaffold
        run: |
          for d in .claude/make-it/scaffolds/*/mock-services/mock-oidc; do
            echo "== $d"
            (cd "$d" && "$RUNNER_TEMP/mock-oidc-venv/bin/python" -I -B test_app.py)
          done
      - name: Run every scripts/test-*.sh
        env:
          REQUIRE_SCAFFOLD_PYTEST: "1"
          MOCK_OIDC_PYTHON: ${{ runner.temp }}/mock-oidc-venv/bin/python
        run: |
          failed=""
          count=0
          for t in scripts/test-*.sh; do
            count=$((count + 1))
            if out="$(bash "$t" 2>&1)"; then
              echo "ok    $t"
            else
              echo "FAIL  $t"
              failed="$failed $t"
              echo "::group::output of $t"
              printf '%s\n' "$out" | tail -n 80
              echo "::endgroup::"
            fi
          done
          echo "$count test scripts run"
          if [ "$count" -lt 30 ]; then
            echo "Fewer than 30 test scripts were found; the glob or the checkout is wrong."
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
