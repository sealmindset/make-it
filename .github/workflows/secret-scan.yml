name: Secret Scan

# secret-scan.py is argo-it's last check before a send: if it misreads git's output it reports
# "clean" and a hardcoded secret ships. --self-test runs test_secret_scan.py -- throwaway repos
# with hostile git config, odd file names, merges, binary and huge files -- so a regression
# fails here, on Linux git, not on a user's deploy.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: secret-scan self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # zsh: the self-test runs argo-it 3e's .env check under bash and zsh. git-lfs: so the LFS cases run, not skip.
      - run: sudo apt-get update && sudo apt-get install -y zsh git-lfs
      - run: python3 .claude/make-it/scripts/secret-scan.py --self-test
