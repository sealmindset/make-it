name: Secret Scan

# secret-scan.py is argo-it's last check before a send: if it misreads git's output it reports
# "clean" and a hardcoded secret ships. scripts/test-secret-scan.py builds throwaway repos -- hostile
# git config, odd file names, merges, binary and huge files -- and follows argo-it's steps as
# written, so a regression fails here, on Linux git, not on a user's deploy.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: secret-scan contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # zsh: the tests run argo-it 3e's .env check under bash and zsh. git-lfs: so the LFS cases run, not skip.
      - run: sudo apt-get update && sudo apt-get install -y zsh git-lfs
      # The fixtures push to `main`; ubuntu's git names a new repo's first branch `master` otherwise.
      - run: git config --global init.defaultBranch main
      - run: python3 -I scripts/test-secret-scan.py
